[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshade"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["layer0*", "layer1a*", "layer1b*", "layer1c*", "layer2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "WARNING"
